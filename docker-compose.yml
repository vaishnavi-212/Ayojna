# Local infrastructure. Start with:  docker compose up -d
services:
  minio:            # S3-compatible object storage: our real storage tiers
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ayojna}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please}
    volumes: ["minio-data:/data"]
  redis:            # supervisor state: lease, checkpoints, result store
    image: redis:7-alpine
    ports: ["6379:6379"]
  opa:              # policy engine: evaluates config/policy.rego (slide 4: "OPA · fails closed")
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr", ":8181", "--disable-telemetry", "/policy/policy.rego"]
    ports: ["8181:8181"]
    volumes: ["./config:/policy:ro"]
  prometheus:       # scrapes the API's /metrics (start the API on port 8000 first)
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    volumes: ["./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:          # live KPI dashboard, provisioned from config/grafana (open http://localhost:3000)
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-please}
    volumes: ["./config/grafana:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus]
volumes:
  minio-data: